[package]
name = "cedar-app"
# Keep in step with the workspace version in ../Cargo.toml: the release workflow checks both, and
# this version picks the sandbox images the app pulls (ghcr.io/hanneshapke/cedar-sandbox:<version>).
version = "0.2.0"
edition = "2021"
description = "Cedar for macOS and Windows: a menu bar / tray app that runs the cedar agent server and its chat UI"
license = "Apache-2.0"

# Not a workspace member (see ../Cargo.toml): Tauri needs system libraries the servers don't.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
# The elevated PowerShell script of the Windows Docker setup goes in as -EncodedCommand (src/winsetup.rs).
base64 = "0.22"
# The QR code and the Tailscale checks, shared with cedar-chat's Settings page.
cedar-pairing = { path = "../pairing" }
futures-util = "0.3"
hex = "0.4"
open = "5"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The hash the elevated Docker setup checks its script against (src/winsetup.rs).
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Checks the latest release's latest.json, verifies its signature, installs it (src/update.rs).
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "fs", "net"] }
tokio-util = "0.7"
url = "2"

[target.'cfg(unix)'.dependencies]
# SIGTERM for a graceful stop (see src/supervisor.rs); Windows closes the servers' stdin instead.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Notification Center, with the click that opens the conversation (see src/notify.rs).
mac-notification-sys = "0.6"
# Lets those banners show while Cedar is the frontmost app (see `present_while_frontmost`).
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
# Toast notifications, with the click that opens the conversation (see src/notify.rs).
tauri-winrt-notification = "0.8"
# Starting Cedar again (Start Menu, a toast clicked after its handler went) shows the running one.
tauri-plugin-single-instance = "2"

[profile.release]
strip = true
codegen-units = 1
lto = true
