[package]
name = "cedar"
version.workspace = true
edition = "2021"
description = "A backend service for running LLM agents in sandboxed containers"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
arc-swap = "1"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
# Downscaling the images attached to a run (`max_image_side`, see src/images.rs).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
futures-util = "0.3"
hex = "0.4"
html2text = "0.17"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "signal", "time", "sync", "io-util", "io-std", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[workspace]
members = [".", "chat", "pairing"]
# The desktop app (a Tauri crate) is built on its own: it needs system libraries the servers don't.
exclude = ["desktop"]

[workspace.package]
version = "0.2.3"
