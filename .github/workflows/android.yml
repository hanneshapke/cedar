name: Android

# Builds the Android app and runs its tests on a Linux runner, for every change to `android/` (a
# pull request, or a push to main) and on request. The plain-Kotlin `core` module's unit tests (the /api
# types, the transcript reducer, the SSE parser, Markdown, cards, attachments, the client) run
# first, then Android lint and a debug APK, which is kept as an artifact for a week.
#
# A build without the ANDROID_GOOGLE_SERVICES_JSON secret (a fork's pull request, say) leaves FCM
# out and still passes; the app then offers ntfy (UnifiedPush) only. The signed release APK is built
# by release.yml; the release-apk job below builds it with the same secrets on every push to main, to test them.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image carries the Android SDK (ANDROID_HOME, licenses accepted); the Android
      # Gradle plugin fetches the platform it compiles against if it is missing.
      - uses: gradle/actions/setup-gradle@v4

      - name: Firebase config (FCM), when the secret is there
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Building with FCM"
          else
            echo "No ANDROID_GOOGLE_SERVICES_JSON: building without FCM (ntfy / UnifiedPush only)"
          fi

      - name: Core unit tests
        run: ./gradlew --no-daemon :core:test

      - name: Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Lint
        run: |
          ./gradlew --no-daemon :app:lintDebug || {
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            exit 1
          }

      - name: Keep the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cedar-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/core/build/reports/
            android/app/build/reports/
          retention-days: 7
          if-no-files-found: ignore

  # The release APK, signed with the repository's release key, the way release.yml builds it: a
  # check that the ANDROID_KEYSTORE* secrets work before a release needs them. Runs on pushes to
  # main (secrets aren't given to pull requests from forks) and on request; without the
  # secrets it says so and stops. The APK is kept as an artifact for a week.
  release-apk:
    needs: build-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key and Firebase config
        id: secrets
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          set -eu
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::notice::ANDROID_KEYSTORE is not set: skipping the signed release APK"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/cedar.jks"
          echo "CEDAR_KEYSTORE=$RUNNER_TEMP/cedar.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Building with FCM"
          else
            echo "No ANDROID_GOOGLE_SERVICES_JSON: building without FCM (ntfy / UnifiedPush only)"
          fi

      - name: Signed release APK
        if: steps.secrets.outputs.signed == 'true'
        env:
          CEDAR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CEDAR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CEDAR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          ./gradlew --no-daemon :app:assembleRelease
          apk=$(ls app/build/outputs/apk/release/*.apk)
          case "$apk" in *unsigned*) echo "::error::the APK came out unsigned"; exit 1 ;; esac
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          # The certificate's fingerprint: the same on every release, or phones won't update.
          "$apksigner" verify --verbose --print-certs "$apk" | grep -E "Verified using|Signer #1 certificate (DN|SHA-256)"

      - name: Keep the release APK
        if: steps.secrets.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cedar-android-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error
