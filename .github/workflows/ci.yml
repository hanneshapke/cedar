name: CI

# The same checks the README's Development section lists, over the whole workspace (cedar and
# cedar-chat), on Linux and Windows. The Docker-backed tests are #[ignore]d, so none of this needs
# Docker or the network.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Whether a pull request touches anything the Rust jobs build or read. One that changes only the
  # landing page, the screenshots, the mobile apps (they have their own workflows) or top-level
  # Markdown skips clippy, test and windows; a skipped job counts as passed for a required check.
  # Pushes to main always run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      # On a pull request the filter asks the API for the changed files, so it needs no checkout.
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            rust:
              - '**'
              - '!docs/landing/**'
              - '!docs/screenshots/**'
              - '!docs/scripts/**'
              - '!android/**'
              - '!iOS/**'
              - '!*.md'
              - '!bench/**'
              - '!.github/workflows/android.yml'
              - '!.github/workflows/ios.yml'
              - '!.github/workflows/pages.yml'
              - '!.github/workflows/testflight.yml'

  clippy:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  # The servers and the desktop app on Windows (desktop/README.md). Steps run in PowerShell, so
  # the Perl that builds cedar-chat's static OpenSSL is Strawberry Perl, not Git's.
  windows:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # The registry test hashes the tools' files as committed; a CRLF checkout would change them.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop -> target
      - run: cargo build --workspace --locked
      # Every test binary, so one run shows all that is Windows-specific, not just the first.
      - run: cargo test --workspace --locked --no-fail-fast
      - name: The desktop app compiles and lints clean
        # tauri-build wants the sidecars to exist; their contents only matter for a bundle.
        run: |
          New-Item -ItemType File -Force desktop/binaries/cedar-x86_64-pc-windows-msvc.exe, desktop/binaries/cedar-chat-x86_64-pc-windows-msvc.exe | Out-Null
          cargo clippy --manifest-path desktop/Cargo.toml --all-targets --locked -- -D warnings
      # The PowerShell the Docker and Tailscale setups run (desktop/src/winsetup.rs, tssetup.rs)
      # parses on a real Windows.
      - run: cargo test --manifest-path desktop/Cargo.toml --locked setup

  # The community tool registry (registry/): every tool follows the rules and the index is up to
  # date. cedar's own checks run on the tools too, in `tests/registry.rs` under `test`.
  # cedar-bench: every task file valid, and the fixture server, graders and runner tested (no Docker,
  # no network; bench/scripts/smoke.sh is the end-to-end check against a real cedar).
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: pip install -r bench/requirements.txt
      - run: PYTHONPATH=bench python3 -m cedar_bench validate
      - run: PYTHONPATH=bench python3 -m unittest discover -s bench/tests

  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: python3 registry/build_index.py --check

  # The translations of the web chat and the desktop app: every key in English, German and French,
  # with the same placeholders, and every key the pages use defined.
  i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/check-i18n.js
