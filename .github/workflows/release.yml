# Builds a release when a pull request from a `release/*` branch is merged into main.
#
# Cedar is released as three platforms that share major.minor and count patches on their own
# (scripts/lib-versions.sh): cedar (the servers, the desktop app and the images; tag v<version>),
# android (tag android-v<version>) and ios (tag ios-v<version>). A release publishes the
# platforms whose version has no tag yet, which are the ones the pull request bumped
# (scripts/bump-version.sh, scripts/release-plan.sh). So a desktop fix doesn't put an unchanged
# app through TestFlight and app review again, and a phone fix doesn't make every desktop update.
#
#   1. verify   the versions fit together (scripts/check-version.sh), which platforms to release,
#               and, for cedar, that the tests pass
#
# cedar:
#   2. images   the sandbox and browser images, built natively for amd64 and arm64 and pushed to
#               GHCR as ghcr.io/<owner>/cedar-sandbox:<version> (and :latest); the app pulls these
#   3. dmg      cedar and cedar-chat for Apple Silicon, wrapped in Cedar.app, signed, notarized,
#               and packed into a DMG (no Intel build: openssl-sys can't cross-compile to x86_64)
#   4. msi      cedar.exe and cedar-chat.exe for x64 Windows, wrapped in Cedar.exe and packed into
#               an MSI (unsigned for now: SmartScreen warns on first run, see desktop/README.md)
#   5. linux    cedar and cedar-chat for x64 and arm64 Linux, in a tarball each (built on Ubuntu
#               22.04, so they run on glibc 2.35 and newer; OpenSSL is linked in)
#
# android:
#   6. apk      the Android app as a signed release APK (android/), versionName <version> and
#               versionCode major*1000000 + minor*1000 + patch, so every release updates in place
#
# ios:
#   7. ios      the iOS app archived, signed and uploaded to TestFlight (testflight.yml); App Store
#               apps can't be attached to a GitHub Release, so TestFlight is where it is published
#   8. ipa      the iOS app as an unsigned IPA (ipa.yml), for sideloading with SideStore or AltStore
#
#   9. release  one tag and GitHub Release per platform released, at the merge commit:
#               v<version> with the DMG, MSI and Linux tarballs, the desktop app's update bundles
#               and their signatures, and latest.json, which installed desktop apps check for
#               updates (desktop/src/update.rs); android-v<version> with the APK; ios-v<version>
#               with the IPA. Only v<version> is ever GitHub's "latest" release, which the desktop
#               and Linux updaters and the chat's update banner read. Then run pages.yml, which
#               puts the release on the landing site and the IPA in the SideStore source
#               (docs/sidestore); merging the pull request alone doesn't
#
# Run it by hand (Actions -> Release -> Run workflow) to build the chosen platforms from the
# current commit as artifacts, without tagging or publishing. Images are still pushed, under the
# version in Cargo.toml. The iOS upload is skipped: TestFlight -> Run workflow does that on its own.
#
# Secrets (Settings -> Secrets and variables -> Actions), all required by the dmg job:
#   APPLE_CERTIFICATE           the Developer ID Application certificate as a base64 .p12
#   APPLE_CERTIFICATE_PASSWORD  its password
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: <name> (<team id>)"
#   ASC_KEY_ID                  an App Store Connect API key's id, which notarizes the app and DMG
#   ASC_ISSUER_ID               its issuer id
#   ASC_KEY_P8                  the contents of its AuthKey_<id>.p8
# The API key is the one testflight.yml uploads with (App Manager role; Developer is enough here).
#
# The dmg and msi jobs also sign the desktop app's updates (see desktop/README.md, "Updates"):
#   TAURI_SIGNING_PRIVATE_KEY           the updater's private key (`cargo tauri signer generate`)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
# and build its public half into the app from a repository variable (Settings -> Secrets and
# variables -> Actions -> Variables), as installed apps check every update against it:
#   CEDAR_UPDATER_PUBKEY                the contents of the generated .pub file
#
# The apk job signs with these (required to publish; a manual run without them builds unsigned):
#   ANDROID_KEYSTORE            the release keystore (.jks) as base64. Keep the same key forever:
#                               installed apps only update from APKs signed with it
#   ANDROID_KEYSTORE_PASSWORD   its password
#   ANDROID_KEY_ALIAS           the key's alias in it
#   ANDROID_KEY_PASSWORD        the key's password
#   ANDROID_GOOGLE_SERVICES_JSON  optional: the Firebase project's google-services.json, for FCM
#                               (without it the APK uses ntfy / UnifiedPush only)
# The ios job takes the secrets testflight.yml lists (IOS_DIST_CERT_P12, IOS_DIST_CERT_PASSWORD,
# IOS_PROFILE, KEYCHAIN_PASSWORD and the ASC_* key above); see iOS/README.md.
# GHCR uses the workflow's own GITHUB_TOKEN. See desktop/README.md for the one-time steps.

name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: "What to build from this commit, at the versions it carries (no tag or release is created)"
        required: true
        default: all
        type: choice
        options: [all, cedar, mobile, android, ios]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.pull_request.head.ref || 'manual' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    # A merged PR from a release/* branch of this repository, or a manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      # Which platforms this run releases ('true' or 'false'), and their versions.
      cedar: ${{ steps.plan.outputs.cedar }}
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      version: ${{ steps.plan.outputs.cedar_version }}
      android_version: ${{ steps.plan.outputs.android_version }}
      ios_version: ${{ steps.plan.outputs.ios_version }}
      # The tag of each platform's last release, where its release notes start.
      cedar_previous: ${{ steps.plan.outputs.cedar_previous }}
      android_previous: ${{ steps.plan.outputs.android_previous }}
      ios_previous: ${{ steps.plan.outputs.ios_previous }}
      sha: ${{ steps.meta.outputs.sha }}
      publish: ${{ steps.meta.outputs.publish }}
      image_owner: ${{ steps.meta.outputs.image_owner }}
    steps:
      - name: Work out the commit to build
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PUSH_SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          if [ "$EVENT" = workflow_dispatch ]; then
            sha=$PUSH_SHA; publish=false
          else
            sha=$MERGE_SHA; publish=true
          fi
          {
            echo "sha=$sha"
            echo "publish=$publish"
            echo "image_owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          } >> "$GITHUB_OUTPUT"
          echo "building $sha (publish: $publish)"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - name: The versions fit together
        # Cedar's three places agree, and the phone apps are on the same major.minor;
        # release-check.yml runs the same check on the open pull request.
        run: scripts/check-version.sh

      - name: What this release publishes
        # A merged pull request releases every platform whose version has no tag yet; a manual
        # run builds the platforms it was asked for.
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -eu
          if [ "$EVENT" = workflow_dispatch ]; then
            scripts/release-plan.sh --only "$PLATFORMS" > plan.txt
          else
            scripts/release-plan.sh > plan.txt
          fi
          cat plan.txt >> "$GITHUB_OUTPUT"
          {
            echo "### Release plan"
            echo
            echo "| Platform | Version | Released by this run |"
            echo "| --- | --- | --- |"
            for p in cedar android ios; do
              echo "| $p | $(sed -n "s/^${p}_version=//p" plan.txt) | $(sed -n "s/^$p=//p" plan.txt | sed 's/true/yes/; s/false/no/') |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -qx 'any=false' plan.txt; then
            echo "::error::every version here is released already: bump the platforms to release with scripts/bump-version.sh"; exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.plan.outputs.cedar == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.plan.outputs.cedar == 'true'

      # The phone apps have their own tests: the apk job runs the Android ones, ios.yml the iOS ones.
      - if: steps.plan.outputs.cedar == 'true'
        run: cargo test --workspace --locked

  images:
    needs: verify
    if: needs.verify.outputs.cedar == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the sandbox image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: sandbox
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/${{ needs.verify.outputs.image_owner }}/cedar-sandbox:${{ needs.verify.outputs.version }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=The environment cedar runs an agent's tools in
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
          # The GitHub Actions cache sometimes refuses a write ("failed to reserve cache"); that
          # must not cancel the push, the cache only speeds up the next build.
          cache-from: type=gha,scope=sandbox-${{ matrix.arch }}
          cache-to: type=gha,scope=sandbox-${{ matrix.arch }},mode=max,ignore-error=true

      - name: Build and push the browser image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: browser
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/${{ needs.verify.outputs.image_owner }}/cedar-browser:${{ needs.verify.outputs.version }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=The headless Chromium behind cedar's browser tool
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
          cache-from: type=gha,scope=browser-${{ matrix.arch }}
          cache-to: type=gha,scope=browser-${{ matrix.arch }},mode=max,ignore-error=true

  manifests:
    # One multi-arch tag per image, pointing at the two builds above.
    needs: [verify, images]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the multi-arch tags
        env:
          REPO: ghcr.io/${{ needs.verify.outputs.image_owner }}
          VERSION: ${{ needs.verify.outputs.version }}
          PUBLISH: ${{ needs.verify.outputs.publish }}
        run: |
          set -eu
          for image in cedar-sandbox cedar-browser; do
            tags="-t $REPO/$image:$VERSION"
            # A manual run must not move :latest.
            [ "$PUBLISH" = true ] && tags="$tags -t $REPO/$image:latest"
            docker buildx imagetools create $tags "$REPO/$image:$VERSION-amd64" "$REPO/$image:$VERSION-arm64"
            docker buildx imagetools inspect "$REPO/$image:$VERSION"
          done

  dmg:
    needs: verify
    if: needs.verify.outputs.cedar == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: apple-silicon
    runs-on: macos-15
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      # tauri-bundler notarizes with the API key only while APPLE_ID is unset, so leave it out
      APPLE_API_KEY: ${{ secrets.ASC_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      # Signs the update bundle; the public key is built into the app, which checks updates with it.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      CEDAR_UPDATER_PUBKEY: ${{ vars.CEDAR_UPDATER_PUBKEY }}
    steps:
      - name: Signing and notarization secrets are set
        # Without them tauri-bundler only warns and ships an unsigned app, so check up front.
        run: |
          missing=
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER ASC_KEY_P8 TAURI_SIGNING_PRIVATE_KEY CEDAR_UPDATER_PUBKEY; do
            eval "val=\${$v:-}"
            [ -n "$val" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing (see .github/workflows/release.yml)"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Restores the cache release-cache.yml saves on main: a cache saved here, under the release
      # pull request's merge ref, would be invisible to the next release, so only main saves one.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            desktop -> target

      - name: Build cedar and cedar-chat
        run: cargo build --release --locked -p cedar -p cedar-chat --target ${{ matrix.target }}

      - name: Put them where the bundler expects sidecars
        run: |
          set -eu
          install -m 0755 "target/${{ matrix.target }}/release/cedar" "desktop/binaries/cedar-${{ matrix.target }}"
          install -m 0755 "target/${{ matrix.target }}/release/cedar-chat" "desktop/binaries/cedar-chat-${{ matrix.target }}"
          ls -l desktop/binaries

      - name: Write the App Store Connect key
        # A file outside the checkout, for tauri-bundler (APPLE_API_KEY_PATH) and notarytool.
        run: |
          set -eu
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      - uses: cargo-bins/cargo-binstall@main

      - name: Install the Tauri CLI
        run: cargo binstall -y --locked tauri-cli --version '^2'

      - name: Hand the updater's public key to the Tauri CLI
        # After signing the update bundle, the CLI checks the signature against
        # plugins.updater.pubkey, which tauri.conf.json leaves empty (the key lives in a variable).
        run: |
          set -eu
          conf="$RUNNER_TEMP/updater-pubkey.conf.json"
          jq -n --arg key "$(printf '%s' "$CEDAR_UPDATER_PUBKEY" | tr -d '[:space:]')" \
            '{plugins: {updater: {pubkey: $key}}}' > "$conf"
          echo "UPDATER_PUBKEY_CONF=$conf" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize Cedar.app, then pack the DMG and the update bundle
        # tauri.release.conf.json turns on the update bundle: Cedar.app.tar.gz, signed (.sig) with
        # the updater key, made from the signed, notarized and stapled app.
        #
        # Tried up to three times: on GitHub's macOS runners `hdiutil create` now and then fails
        # with "Resource busy" while the DMG is packed, and the same command passes when run
        # again. A further try compiles nothing; it signs and notarizes the app once more.
        working-directory: desktop
        run: |
          set -u
          for try in 1 2 3; do
            if cargo tauri build --ci --target ${{ matrix.target }} --bundles app,dmg --config tauri.release.conf.json --config "$UPDATER_PUBKEY_CONF"; then
              exit 0
            fi
            echo "::warning::cargo tauri build failed (try $try of 3)"
            # What a failed try left of the disk image, so the next step finds one DMG only.
            rm -f target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            sleep 20
          done
          echo "::error::cargo tauri build failed three times"; exit 1

      - name: Notarize and staple the DMG itself
        # tauri-bundler notarizes and staples the .app inside; the DMG gets its own ticket so
        # Gatekeeper is happy before the app is even copied out of it.
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          built=$(ls desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          mkdir -p dist
          dmg="dist/Cedar-$VERSION-$ARCH.dmg"
          mv "$built" "$dmg"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          # Stapling fetches the ticket from Apple's CloudKit, which sometimes drops the connection
          # (NSURLErrorDomain -1005) or doesn't serve a fresh ticket yet; try again before failing.
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "$dmg"; then break; fi
            if [ "$attempt" -eq 5 ]; then echo "::error::stapling $dmg failed 5 times"; exit 1; fi
            echo "::warning::stapling failed (attempt $attempt); trying again in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          spctl -a -t open --context context:primary-signature -vv "$dmg" || echo "::warning::spctl did not accept $dmg on this runner; check it on a Mac after the release"

      - name: Name the update bundle, and check the app in it is stapled
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          dir=desktop/target/${{ matrix.target }}/release/bundle/macos
          bundle="dist/Cedar-$VERSION-$ARCH.app.tar.gz"
          mv "$dir/Cedar.app.tar.gz" "$bundle"
          mv "$dir/Cedar.app.tar.gz.sig" "$bundle.sig"
          check=$(mktemp -d)
          tar -xzf "$bundle" -C "$check"
          xcrun stapler validate "$check/Cedar.app" || { echo "::error::the app in $bundle carries no notarization ticket"; exit 1; }
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.app.tar.gz
            dist/*.app.tar.gz.sig
          if-no-files-found: error

  msi:
    needs: verify
    if: needs.verify.outputs.cedar == 'true'
    # WiX, which Tauri builds the MSI with, only runs on Windows. Steps run in PowerShell, so the
    # Perl that builds cedar-chat's static OpenSSL is Strawberry Perl, not Git's.
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      CEDAR_UPDATER_PUBKEY: ${{ vars.CEDAR_UPDATER_PUBKEY }}
    steps:
      - name: The updater key is set
        run: |
          foreach ($v in 'TAURI_SIGNING_PRIVATE_KEY', 'CEDAR_UPDATER_PUBKEY') {
            if (-not [Environment]::GetEnvironmentVariable($v)) { throw "missing repository secret or variable $v (see .github/workflows/release.yml)" }
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Restores the cache release-cache.yml saves on main (see the dmg job).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-x86_64-pc-windows-msvc
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            desktop -> target

      # The MSVC C runtime linked in, not loaded from VCRUNTIME140.dll: Windows doesn't ship that
      # DLL (the Visual C++ Redistributable does), so without it the servers don't start. Cedar.exe
      # needs nothing here; tauri-build links its runtime statically already.
      - name: Build cedar and cedar-chat
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p cedar -p cedar-chat --target $env:TARGET

      - name: Put them where the bundler expects sidecars
        run: |
          Copy-Item "target/$env:TARGET/release/cedar.exe" "desktop/binaries/cedar-$env:TARGET.exe"
          Copy-Item "target/$env:TARGET/release/cedar-chat.exe" "desktop/binaries/cedar-chat-$env:TARGET.exe"
          Get-ChildItem desktop/binaries

      - uses: cargo-bins/cargo-binstall@main

      - name: Install the Tauri CLI
        run: cargo binstall -y --locked tauri-cli --version '^2'

      - name: Hand the updater's public key to the Tauri CLI
        # After signing the MSI, the CLI checks the signature against plugins.updater.pubkey,
        # which tauri.conf.json leaves empty (the key lives in a variable).
        run: |
          $conf = Join-Path $env:RUNNER_TEMP 'updater-pubkey.conf.json'
          $key = $env:CEDAR_UPDATER_PUBKEY -replace '\s', ''
          @{ plugins = @{ updater = @{ pubkey = $key } } } | ConvertTo-Json -Depth 5 | Set-Content -Path $conf -Encoding utf8NoBOM
          "UPDATER_PUBKEY_CONF=$conf" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Cedar.exe and pack the MSI
        # tauri.release.conf.json also signs the MSI for the updater (.msi.sig).
        working-directory: desktop
        run: cargo tauri build --ci --target $env:TARGET --bundles msi --config tauri.release.conf.json --config $env:UPDATER_PUBKEY_CONF

      - name: Check that no executable needs the Visual C++ Redistributable
        run: |
          # The app is cedar-app.exe as cargo builds it, Cedar.exe once the Tauri CLI renamed it.
          $app = Get-ChildItem "desktop/target/$env:TARGET/release/*.exe" |
            Where-Object { $_.Name -in 'cedar-app.exe', 'Cedar.exe' } | Select-Object -First 1
          if (-not $app) { throw "Cedar.exe is not in desktop/target/$env:TARGET/release" }
          $exes = @(
            "target/$env:TARGET/release/cedar.exe",
            "target/$env:TARGET/release/cedar-chat.exe",
            $app.FullName
          )
          foreach ($exe in $exes) {
            $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe))
            if ($text -match '(?i)(vcruntime|msvcp)1[0-9]{2}d?\.dll') {
              throw "$exe imports $($Matches[0]), which a PC without the Visual C++ Redistributable lacks"
            }
            "$exe needs no Visual C++ runtime DLL"
          }

      - name: Name the MSI
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          $built = Get-ChildItem "desktop/target/$env:TARGET/release/bundle/msi/*.msi"
          if ($built.Count -ne 1) { throw "expected one MSI, found $($built.Count)" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item $built.FullName "dist/Cedar-$env:VERSION-x64.msi"
          Move-Item "$($built.FullName).sig" "dist/Cedar-$env:VERSION-x64.msi.sig"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: msi-x64
          path: |
            dist/*.msi
            dist/*.msi.sig
          if-no-files-found: error

  apk:
    needs: verify
    if: needs.verify.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key and Firebase config
        env:
          PUBLISH: ${{ needs.verify.outputs.publish }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          set -eu
          if [ -n "$ANDROID_KEYSTORE" ]; then
            printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/cedar.jks"
            echo "CEDAR_KEYSTORE=$RUNNER_TEMP/cedar.jks" >> "$GITHUB_ENV"
          elif [ "$PUBLISH" = true ]; then
            echo "::error::ANDROID_KEYSTORE is not set; a published APK must be signed with the release key"; exit 1
          else
            echo "::warning::ANDROID_KEYSTORE is not set: building an unsigned APK"
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::warning::ANDROID_GOOGLE_SERVICES_JSON is not set: the APK has no FCM, only ntfy / UnifiedPush"
          fi

      - name: Build the release APK
        env:
          VERSION: ${{ needs.verify.outputs.android_version }}
          CEDAR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CEDAR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CEDAR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          ./gradlew --no-daemon -Pcedar.version="$VERSION" :core:test :app:assembleRelease
          built=$(ls app/build/outputs/apk/release/*.apk)
          [ "$(echo "$built" | wc -l)" = 1 ] || { echo "::error::expected one APK, found: $built"; exit 1; }
          mkdir -p ../dist
          if [ -n "${CEDAR_KEYSTORE:-}" ]; then
            apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            "$apksigner" verify --print-certs "$built" | head -3
            mv "$built" "../dist/Cedar-$VERSION-android.apk"
          else
            mv "$built" "../dist/Cedar-$VERSION-android-unsigned.apk"
          fi
          ls -l ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk-android
          path: dist/*.apk
          if-no-files-found: error

  linux:
    needs: verify
    if: needs.verify.outputs.cedar == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}

      - name: Build cedar, cedar-chat and cedar-llama
        run: cargo build --release --locked -p cedar -p cedar-chat -p cedar-llama

      - name: Check that they need no OpenSSL from the system
        # cedar uses rustls and cedar-chat links a vendored OpenSSL, so a server without libssl3
        # (or with another version of it) runs them too.
        run: |
          set -eu
          for exe in target/release/cedar target/release/cedar-chat target/release/cedar-llama; do
            ldd "$exe"
            if ldd "$exe" | grep -Eq 'lib(ssl|crypto)\.so'; then
              echo "::error::$exe loads OpenSSL from the system"; exit 1
            fi
          done

      - name: Pack the tarball
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          name="Cedar-$VERSION-linux-$ARCH"
          mkdir -p "dist/$name"
          install -m 0755 target/release/cedar target/release/cedar-chat target/release/cedar-llama "dist/$name/"
          install -m 0644 LICENSE NOTICE README.md DEPLOYMENT.md "dist/$name/"
          # The one-click updater DEPLOYMENT.md's "Updates" sets up.
          install -m 0755 scripts/cedar-update.sh "dist/$name/cedar-update"
          install -m 0644 scripts/systemd/cedar-update.path scripts/systemd/cedar-update.service "dist/$name/"
          # llama.cpp as the model server on a machine with a GPU (README.md, "Models").
          install -m 0644 scripts/systemd/cedar-llama.service "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          tar -tzvf "dist/$name.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  ios:
    needs: verify
    # An upload to App Store Connect is a publication, so a manual run of this workflow skips it.
    if: needs.verify.outputs.ios == 'true' && needs.verify.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/testflight.yml
    with:
      ref: ${{ needs.verify.outputs.sha }}
    secrets: inherit

  ipa:
    needs: verify
    if: needs.verify.outputs.ios == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ipa.yml
    with:
      ref: ${{ needs.verify.outputs.sha }}

  release:
    needs: [verify, manifests, dmg, msi, apk, linux, ios, ipa]
    # The jobs of a platform that isn't released are skipped, which must not skip this one; a
    # failed or cancelled job must.
    if: >-
      always() && needs.verify.result == 'success' && needs.verify.outputs.publish == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write   # to start pages.yml
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHA: ${{ needs.verify.outputs.sha }}
      SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      # Each platform's files in a directory of their own: each gets its own GitHub Release.
      - uses: actions/download-artifact@v4
        if: needs.verify.outputs.cedar == 'true'
        with:
          pattern: dmg-*
          path: dist/cedar
          merge-multiple: true

      - uses: actions/download-artifact@v4
        if: needs.verify.outputs.cedar == 'true'
        with:
          pattern: msi-*
          path: dist/cedar
          merge-multiple: true

      - uses: actions/download-artifact@v4
        if: needs.verify.outputs.cedar == 'true'
        with:
          pattern: linux-*
          path: dist/cedar
          merge-multiple: true

      - uses: actions/download-artifact@v4
        if: needs.verify.outputs.android == 'true'
        with:
          pattern: apk-*
          path: dist/android
          merge-multiple: true

      - uses: actions/download-artifact@v4
        if: needs.verify.outputs.ios == 'true'
        with:
          pattern: ipa-*
          path: dist/ios
          merge-multiple: true

      - name: The desktop app's update manifest
        # What installed desktop apps read (releases/latest/download/latest.json, in
        # tauri.conf.json): the version, and per platform the update bundle and its signature.
        if: needs.verify.outputs.cedar == 'true'
        working-directory: dist/cedar
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          base="https://github.com/$REPO/releases/download/v$VERSION"
          mac="Cedar-$VERSION-apple-silicon.app.tar.gz"
          win="Cedar-$VERSION-x64.msi"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "https://github.com/$REPO/releases/tag/v$VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_url "$base/$mac" --rawfile mac_sig "$mac.sig" \
            --arg win_url "$base/$win" --rawfile win_sig "$win.sig" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
                "darwin-aarch64": {url: $mac_url, signature: ($mac_sig | rtrimstr("\n"))},
                "windows-x86_64": {url: $win_url, signature: ($win_sig | rtrimstr("\n"))}
              }}' > latest.json
          cat latest.json

      - name: Checksums
        # One checksums.txt per release; cedar's is what cedar-update checks a tarball against.
        env:
          CEDAR: ${{ needs.verify.outputs.cedar }}
          ANDROID: ${{ needs.verify.outputs.android }}
          IOS: ${{ needs.verify.outputs.ios }}
        run: |
          set -eu
          [ "$CEDAR" != true ]   || (cd dist/cedar && sha256sum *.dmg *.msi *.tar.gz | tee checksums.txt)
          [ "$ANDROID" != true ] || (cd dist/android && sha256sum *.apk | tee checksums.txt)
          [ "$IOS" != true ]     || (cd dist/ios && sha256sum *.ipa | tee checksums.txt)

      # Each of the three steps below skips a release that is already out, so the job can be run
      # again after one of them failed.
      - name: Tag and publish Cedar
        if: needs.verify.outputs.cedar == 'true'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PREVIOUS: ${{ needs.verify.outputs.cedar_previous }}
          REPO: ghcr.io/${{ needs.verify.outputs.image_owner }}
        run: |
          set -eu
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::notice::v$VERSION is published already"; exit 0
          fi
          cat > notes.md <<EOF
          ## Cedar $VERSION for macOS

          Download \`Cedar-$VERSION-apple-silicon.dmg\`, drag Cedar to Applications, and open it. It
          runs on Apple Silicon Macs only. The first launch needs Docker Desktop (or OrbStack, Colima)
          running and asks for your model server.

          ## Cedar $VERSION for Windows

          Download \`Cedar-$VERSION-x64.msi\` and run it (it needs administrator rights, like Docker
          Desktop). It runs on 64-bit Windows 10 and 11 with Docker Desktop's WSL 2 backend. The
          installer is not signed yet, so Windows SmartScreen warns the first time: choose *More info*,
          then *Run anyway*.

          ## Cedar $VERSION for Linux

          \`Cedar-$VERSION-linux-x64.tar.gz\` (x86_64) and \`Cedar-$VERSION-linux-arm64.tar.gz\`
          (aarch64, e.g. a DGX Spark) hold the \`cedar\` and \`cedar-chat\` servers for glibc 2.35
          and newer (Ubuntu 22.04, Debian 12). Unpack, install them to \`/usr/local/bin\` and run them
          under systemd as DEPLOYMENT.md describes, in place of building them yourself:

              tar -xzf Cedar-$VERSION-linux-x64.tar.gz
              sudo install -m 0755 Cedar-$VERSION-linux-x64/cedar Cedar-$VERSION-linux-x64/cedar-chat /usr/local/bin/

          The chat shows a banner when a newer release is out. With the \`cedar-update\`
          unit from the tarball set up (DEPLOYMENT.md, "Updates"), its *Update* button installs it;
          \`sudo ./cedar-update\` does the same from a shell.

          Images: \`$REPO/cedar-sandbox:$VERSION\`, \`$REPO/cedar-browser:$VERSION\` (linux/amd64, linux/arm64).

          ## Android, iPhone and iPad

          The phone apps are released on their own, when something in them changes, so their last
          number can differ from the desktop's: every ${VERSION%.*}.x app works with every
          ${VERSION%.*}.x server. The newest ones are linked from $SITE and listed under
          [Releases](https://github.com/$GITHUB_REPOSITORY/releases) as *Cedar for Android* and
          *Cedar for iOS*.

          ## Updating

          The Mac and Windows apps check for new releases themselves and offer them in a banner;
          *Update* downloads the release, checks its signature, and restarts Cedar on it.
          EOF
          gh release create "v$VERSION" \
            --target "$SHA" \
            --title "Cedar $VERSION" \
            --notes "$(cat notes.md)" \
            --generate-notes ${PREVIOUS:+--notes-start-tag "$PREVIOUS"} \
            --latest \
            dist/cedar/*.dmg dist/cedar/*.msi dist/cedar/*.tar.gz dist/cedar/checksums.txt \
            dist/cedar/*.sig dist/cedar/latest.json

      # --latest=false on the phone apps' releases: GitHub's "latest" release has to stay a
      # v<version> one, since the desktop app reads latest.json from it and cedar-update, the
      # chat's update banner and the landing site read its tag as Cedar's version.
      - name: Tag and publish Cedar for Android
        if: needs.verify.outputs.android == 'true'
        env:
          VERSION: ${{ needs.verify.outputs.android_version }}
          PREVIOUS: ${{ needs.verify.outputs.android_previous }}
        run: |
          set -eu
          if gh release view "android-v$VERSION" >/dev/null 2>&1; then
            echo "::notice::android-v$VERSION is published already"; exit 0
          fi
          cat > notes.md <<EOF
          ## Cedar $VERSION for Android

          Download \`Cedar-$VERSION-android.apk\` on the phone and open it (allow installs from
          your browser or file manager when Android asks). It runs on Android 8 and newer and talks to
          your cedar-chat over HTTPS: scan the QR code under Settings → Phone in the chat. Later
          releases install over it. See android/README.md.

          It works with every Cedar ${VERSION%.*}.x on the desktop or server; the last number counts
          the Android app's own fixes.
          EOF
          gh release create "android-v$VERSION" \
            --target "$SHA" \
            --title "Cedar for Android $VERSION" \
            --notes "$(cat notes.md)" \
            --generate-notes ${PREVIOUS:+--notes-start-tag "$PREVIOUS"} \
            --latest=false \
            dist/android/*.apk dist/android/checksums.txt

      - name: Tag and publish Cedar for iOS
        if: needs.verify.outputs.ios == 'true'
        env:
          VERSION: ${{ needs.verify.outputs.ios_version }}
          PREVIOUS: ${{ needs.verify.outputs.ios_previous }}
        run: |
          set -eu
          if gh release view "ios-v$VERSION" >/dev/null 2>&1; then
            echo "::notice::ios-v$VERSION is published already"; exit 0
          fi
          cat > notes.md <<EOF
          ## Cedar $VERSION for iPhone and iPad

          This version is on TestFlight: open the TestFlight invitation on the device and install
          or update Cedar. It needs iOS 17 or newer and pairs with your cedar-chat by scanning the
          QR code under Settings → Phone in the chat. See iOS/README.md.

          To sideload it instead, install \`Cedar-$VERSION-ios.ipa\` with SideStore or AltStore, which
          sign it with your own Apple ID, or add the source
          ${SITE}sidestore.json in SideStore to install it and get
          updates. Sideloaded, the app has no iPhone push; everything else is the same. See
          iOS/README.md, "Sideloading".

          It works with every Cedar ${VERSION%.*}.x on the desktop or server; the last number counts
          the iOS app's own fixes.
          EOF
          gh release create "ios-v$VERSION" \
            --target "$SHA" \
            --title "Cedar for iOS $VERSION" \
            --notes "$(cat notes.md)" \
            --generate-notes ${PREVIOUS:+--notes-start-tag "$PREVIOUS"} \
            --latest=false \
            dist/ios/*.ipa dist/ios/*.source.json dist/ios/checksums.txt

      - name: Update the landing site and the SideStore source
        # pages.yml sets the site's version and download links and rebuilds sidestore.json from
        # the releases, these now included. What the job's token does starts no other workflow,
        # except a workflow_dispatch like this one.
        env:
          REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --repo "$REPO" --ref main
