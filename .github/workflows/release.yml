# Builds a release when a pull request from a `release/<version>` branch is merged into main:
#
#   1. verify   the branch's version matches both Cargo.toml versions and the iOS app's
#               MARKETING_VERSION, the tag is free, tests pass
#   2. images   the sandbox and browser images, built natively for amd64 and arm64 and pushed to
#               GHCR as ghcr.io/<owner>/cedar-sandbox:<version> (and :latest); the app pulls these
#   3. dmg      cedar and cedar-chat for Apple Silicon, wrapped in Cedar.app, signed, notarized,
#               and packed into a DMG (no Intel build: openssl-sys can't cross-compile to x86_64)
#   4. msi      cedar.exe and cedar-chat.exe for x64 Windows, wrapped in Cedar.exe and packed into
#               an MSI (unsigned for now: SmartScreen warns on first run, see desktop/README.md)
#   5. apk      the Android app as a signed release APK (android/), versionName <version> and
#               versionCode major*1000000 + minor*1000 + patch, so every release updates in place
#   6. linux    cedar and cedar-chat for x64 and arm64 Linux, in a tarball each (built on Ubuntu
#               22.04, so they run on glibc 2.35 and newer; OpenSSL is linked in)
#   7. ios      the iOS app archived, signed and uploaded to TestFlight (testflight.yml); App Store
#               apps can't be attached to a GitHub Release, so TestFlight is where it is published
#   8. release  tag v<version> at the merge commit and publish a GitHub Release with the DMG, MSI,
#               APK and Linux tarballs
#
# Run it by hand (Actions -> Release -> Run workflow) with a version to build everything from the
# current commit as artifacts, without tagging or publishing. Images are still pushed, under the
# version given. The iOS upload is skipped: TestFlight -> Run workflow does that on its own.
#
# Secrets (Settings -> Secrets and variables -> Actions), all required by the dmg job:
#   APPLE_CERTIFICATE           the Developer ID Application certificate as a base64 .p12
#   APPLE_CERTIFICATE_PASSWORD  its password
#   APPLE_SIGNING_IDENTITY      "Developer ID Application: <name> (<team id>)"
#   ASC_KEY_ID                  an App Store Connect API key's id, which notarizes the app and DMG
#   ASC_ISSUER_ID               its issuer id
#   ASC_KEY_P8                  the contents of its AuthKey_<id>.p8
# The API key is the one testflight.yml uploads with (App Manager role; Developer is enough here).
#
# The apk job signs with these (required to publish; a manual run without them builds unsigned):
#   ANDROID_KEYSTORE            the release keystore (.jks) as base64. Keep the same key forever:
#                               installed apps only update from APKs signed with it
#   ANDROID_KEYSTORE_PASSWORD   its password
#   ANDROID_KEY_ALIAS           the key's alias in it
#   ANDROID_KEY_PASSWORD        the key's password
#   ANDROID_GOOGLE_SERVICES_JSON  optional: the Firebase project's google-services.json, for FCM
#                               (without it the APK uses ntfy / UnifiedPush only)
# The ios job takes the secrets testflight.yml lists (IOS_DIST_CERT_P12, IOS_DIST_CERT_PASSWORD,
# IOS_PROFILE, KEYCHAIN_PASSWORD and the ASC_* key above); see iOS/README.md.
# GHCR uses the workflow's own GITHUB_TOKEN. See desktop/README.md for the one-time steps.

name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, as it would appear in a release/<version> branch (no tag or release is created)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.pull_request.head.ref || inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    # A merged PR from a release/* branch of this repository, or a manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
      publish: ${{ steps.meta.outputs.publish }}
      image_owner: ${{ steps.meta.outputs.image_owner }}
    steps:
      - name: Work out the version and the commit to build
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PUSH_SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          if [ "$EVENT" = workflow_dispatch ]; then
            version=$INPUT_VERSION; sha=$PUSH_SHA; publish=false
          else
            version=${HEAD_REF#release/}; sha=$MERGE_SHA; publish=true
          fi
          case "$version" in
            ''|*[!0-9A-Za-z.+-]*) echo "::error::'$version' is not a usable version"; exit 1 ;;
          esac
          # Windows Installer takes major.minor.patch only, with major and minor up to 255 and
          # patch up to 65535; a pre-release suffix like -beta is refused when the MSI is built.
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::'$version' is not major.minor.patch, which the Windows installer (MSI) needs"; exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          if [ "$major" -gt 255 ] || [ "$minor" -gt 255 ] || [ "$patch" -gt 65535 ]; then
            echo "::error::'$version' is too large for the Windows installer (MSI): major and minor go up to 255, patch to 65535"; exit 1
          fi
          {
            echo "version=$version"
            echo "sha=$sha"
            echo "publish=$publish"
            echo "image_owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          } >> "$GITHUB_OUTPUT"
          echo "building $version from $sha (publish: $publish)"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo.toml versions match the branch
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eu
          ws=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cedar") | .version')
          app=$(cargo metadata --no-deps --format-version 1 --manifest-path desktop/Cargo.toml | jq -r '.packages[] | select(.name == "cedar-app") | .version')
          echo "workspace: $ws, desktop app: $app, branch: $VERSION"
          [ "$ws" = "$VERSION" ] || { echo "::error::Cargo.toml [workspace.package] version is $ws, the branch says $VERSION"; exit 1; }
          [ "$app" = "$VERSION" ] || { echo "::error::desktop/Cargo.toml version is $app, the branch says $VERSION"; exit 1; }
          # Every build configuration (app and tests, Debug and Release) carries the same version.
          ios=$(grep -o 'MARKETING_VERSION = [^;]*' iOS/Cedar.xcodeproj/project.pbxproj | sed 's/.* = //' | sort -u)
          echo "iOS app: $ios"
          [ "$ios" = "$VERSION" ] || { echo "::error::iOS/Cedar.xcodeproj MARKETING_VERSION is $(echo $ios), the branch says $VERSION"; exit 1; }

      - name: The tag does not exist yet
        if: steps.meta.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --workspace --locked

  images:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the sandbox image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: sandbox
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/${{ needs.verify.outputs.image_owner }}/cedar-sandbox:${{ needs.verify.outputs.version }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=The environment cedar runs an agent's tools in
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
          # The GitHub Actions cache sometimes refuses a write ("failed to reserve cache"); that
          # must not cancel the push, the cache only speeds up the next build.
          cache-from: type=gha,scope=sandbox-${{ matrix.arch }}
          cache-to: type=gha,scope=sandbox-${{ matrix.arch }},mode=max,ignore-error=true

      - name: Build and push the browser image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: browser
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/${{ needs.verify.outputs.image_owner }}/cedar-browser:${{ needs.verify.outputs.version }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=The headless Chromium behind cedar's browser tool
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
          cache-from: type=gha,scope=browser-${{ matrix.arch }}
          cache-to: type=gha,scope=browser-${{ matrix.arch }},mode=max,ignore-error=true

  manifests:
    # One multi-arch tag per image, pointing at the two builds above.
    needs: [verify, images]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the multi-arch tags
        env:
          REPO: ghcr.io/${{ needs.verify.outputs.image_owner }}
          VERSION: ${{ needs.verify.outputs.version }}
          PUBLISH: ${{ needs.verify.outputs.publish }}
        run: |
          set -eu
          for image in cedar-sandbox cedar-browser; do
            tags="-t $REPO/$image:$VERSION"
            # A manual run must not move :latest.
            [ "$PUBLISH" = true ] && tags="$tags -t $REPO/$image:latest"
            docker buildx imagetools create $tags "$REPO/$image:$VERSION-amd64" "$REPO/$image:$VERSION-arm64"
            docker buildx imagetools inspect "$REPO/$image:$VERSION"
          done

  dmg:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: apple-silicon
    runs-on: macos-15
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      # tauri-bundler notarizes with the API key only while APPLE_ID is unset, so leave it out
      APPLE_API_KEY: ${{ secrets.ASC_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Signing and notarization secrets are set
        # Without them tauri-bundler only warns and ships an unsigned app, so check up front.
        run: |
          missing=
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER ASC_KEY_P8; do
            eval "val=\${$v:-}"
            [ -n "$val" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing (see .github/workflows/release.yml)"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            . -> target
            desktop -> target

      - name: Build cedar and cedar-chat
        run: cargo build --release --locked -p cedar -p cedar-chat --target ${{ matrix.target }}

      - name: Put them where the bundler expects sidecars
        run: |
          set -eu
          install -m 0755 "target/${{ matrix.target }}/release/cedar" "desktop/binaries/cedar-${{ matrix.target }}"
          install -m 0755 "target/${{ matrix.target }}/release/cedar-chat" "desktop/binaries/cedar-chat-${{ matrix.target }}"
          ls -l desktop/binaries

      - name: Write the App Store Connect key
        # A file outside the checkout, for tauri-bundler (APPLE_API_KEY_PATH) and notarytool.
        run: |
          set -eu
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      - uses: cargo-bins/cargo-binstall@main

      - name: Install the Tauri CLI
        run: cargo binstall -y --locked tauri-cli --version '^2'

      - name: Build, sign, and notarize Cedar.app, then pack the DMG
        working-directory: desktop
        run: cargo tauri build --ci --target ${{ matrix.target }} --bundles dmg

      - name: Notarize and staple the DMG itself
        # tauri-bundler notarizes and staples the .app inside; the DMG gets its own ticket so
        # Gatekeeper is happy before the app is even copied out of it.
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          built=$(ls desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          mkdir -p dist
          dmg="dist/Cedar-$VERSION-$ARCH.dmg"
          mv "$built" "$dmg"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          # Stapling fetches the ticket from Apple's CloudKit, which sometimes drops the connection
          # (NSURLErrorDomain -1005) or doesn't serve a fresh ticket yet; try again before failing.
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "$dmg"; then break; fi
            if [ "$attempt" -eq 5 ]; then echo "::error::stapling $dmg failed 5 times"; exit 1; fi
            echo "::warning::stapling failed (attempt $attempt); trying again in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          spctl -a -t open --context context:primary-signature -vv "$dmg" || echo "::warning::spctl did not accept $dmg on this runner; check it on a Mac after the release"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  msi:
    needs: verify
    # WiX, which Tauri builds the MSI with, only runs on Windows. Steps run in PowerShell, so the
    # Perl that builds cedar-chat's static OpenSSL is Strawberry Perl, not Git's.
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc
          workspaces: |
            . -> target
            desktop -> target

      # The MSVC C runtime linked in, not loaded from VCRUNTIME140.dll: Windows doesn't ship that
      # DLL (the Visual C++ Redistributable does), so without it the servers don't start. Cedar.exe
      # needs nothing here; tauri-build links its runtime statically already.
      - name: Build cedar and cedar-chat
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p cedar -p cedar-chat --target $env:TARGET

      - name: Put them where the bundler expects sidecars
        run: |
          Copy-Item "target/$env:TARGET/release/cedar.exe" "desktop/binaries/cedar-$env:TARGET.exe"
          Copy-Item "target/$env:TARGET/release/cedar-chat.exe" "desktop/binaries/cedar-chat-$env:TARGET.exe"
          Get-ChildItem desktop/binaries

      - uses: cargo-bins/cargo-binstall@main

      - name: Install the Tauri CLI
        run: cargo binstall -y --locked tauri-cli --version '^2'

      - name: Build Cedar.exe and pack the MSI
        working-directory: desktop
        run: cargo tauri build --ci --target $env:TARGET --bundles msi

      - name: Check that no executable needs the Visual C++ Redistributable
        run: |
          # The app is cedar-app.exe as cargo builds it, Cedar.exe once the Tauri CLI renamed it.
          $app = Get-ChildItem "desktop/target/$env:TARGET/release/*.exe" |
            Where-Object { $_.Name -in 'cedar-app.exe', 'Cedar.exe' } | Select-Object -First 1
          if (-not $app) { throw "Cedar.exe is not in desktop/target/$env:TARGET/release" }
          $exes = @(
            "target/$env:TARGET/release/cedar.exe",
            "target/$env:TARGET/release/cedar-chat.exe",
            $app.FullName
          )
          foreach ($exe in $exes) {
            $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe))
            if ($text -match '(?i)(vcruntime|msvcp)1[0-9]{2}d?\.dll') {
              throw "$exe imports $($Matches[0]), which a PC without the Visual C++ Redistributable lacks"
            }
            "$exe needs no Visual C++ runtime DLL"
          }

      - name: Name the MSI
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          $built = Get-ChildItem "desktop/target/$env:TARGET/release/bundle/msi/*.msi"
          if ($built.Count -ne 1) { throw "expected one MSI, found $($built.Count)" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item $built.FullName "dist/Cedar-$env:VERSION-x64.msi"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: msi-x64
          path: dist/*.msi
          if-no-files-found: error

  apk:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key and Firebase config
        env:
          PUBLISH: ${{ needs.verify.outputs.publish }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          set -eu
          if [ -n "$ANDROID_KEYSTORE" ]; then
            printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/cedar.jks"
            echo "CEDAR_KEYSTORE=$RUNNER_TEMP/cedar.jks" >> "$GITHUB_ENV"
          elif [ "$PUBLISH" = true ]; then
            echo "::error::ANDROID_KEYSTORE is not set; a published APK must be signed with the release key"; exit 1
          else
            echo "::warning::ANDROID_KEYSTORE is not set: building an unsigned APK"
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::warning::ANDROID_GOOGLE_SERVICES_JSON is not set: the APK has no FCM, only ntfy / UnifiedPush"
          fi

      - name: Build the release APK
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          CEDAR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CEDAR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CEDAR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          ./gradlew --no-daemon -Pcedar.version="$VERSION" :core:test :app:assembleRelease
          built=$(ls app/build/outputs/apk/release/*.apk)
          [ "$(echo "$built" | wc -l)" = 1 ] || { echo "::error::expected one APK, found: $built"; exit 1; }
          mkdir -p ../dist
          if [ -n "${CEDAR_KEYSTORE:-}" ]; then
            apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            "$apksigner" verify --print-certs "$built" | head -3
            mv "$built" "../dist/Cedar-$VERSION-android.apk"
          else
            mv "$built" "../dist/Cedar-$VERSION-android-unsigned.apk"
          fi
          ls -l ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk-android
          path: dist/*.apk
          if-no-files-found: error

  linux:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}

      - name: Build cedar and cedar-chat
        run: cargo build --release --locked -p cedar -p cedar-chat

      - name: Check that they need no OpenSSL from the system
        # cedar uses rustls and cedar-chat links a vendored OpenSSL, so a server without libssl3
        # (or with another version of it) runs them too.
        run: |
          set -eu
          for exe in target/release/cedar target/release/cedar-chat; do
            ldd "$exe"
            if ldd "$exe" | grep -Eq 'lib(ssl|crypto)\.so'; then
              echo "::error::$exe loads OpenSSL from the system"; exit 1
            fi
          done

      - name: Pack the tarball
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          name="Cedar-$VERSION-linux-$ARCH"
          mkdir -p "dist/$name"
          install -m 0755 target/release/cedar target/release/cedar-chat "dist/$name/"
          install -m 0644 LICENSE NOTICE README.md DEPLOYMENT.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          tar -tzvf "dist/$name.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  ios:
    needs: verify
    # An upload to App Store Connect is a publication, so a manual run of this workflow skips it.
    if: needs.verify.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/testflight.yml
    with:
      ref: ${{ needs.verify.outputs.sha }}
    secrets: inherit

  release:
    needs: [verify, manifests, dmg, msi, apk, linux, ios]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: msi-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.dmg *.msi *.apk *.tar.gz | tee checksums.txt

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          SHA: ${{ needs.verify.outputs.sha }}
          REPO: ghcr.io/${{ needs.verify.outputs.image_owner }}
        run: |
          set -eu
          cat > notes.md <<EOF
          ## Cedar $VERSION for macOS

          Download \`Cedar-$VERSION-apple-silicon.dmg\`, drag Cedar to Applications, and open it. It
          runs on Apple Silicon Macs only. The first launch needs Docker Desktop (or OrbStack, Colima)
          running and asks for your model server.

          ## Cedar $VERSION for Windows

          Download \`Cedar-$VERSION-x64.msi\` and run it (it needs administrator rights, like Docker
          Desktop). It runs on 64-bit Windows 10 and 11 with Docker Desktop's WSL 2 backend. The
          installer is not signed yet, so Windows SmartScreen warns the first time: choose *More info*,
          then *Run anyway*.

          ## Cedar $VERSION for Android

          Download \`Cedar-$VERSION-android.apk\` on the phone and open it (allow installs from
          your browser or file manager when Android asks). It runs on Android 8 and newer and talks to
          your cedar-chat over HTTPS: scan the QR code under Settings → Phone in the chat. Later
          releases install over it. See android/README.md.

          ## Cedar $VERSION for iPhone and iPad

          This version is on TestFlight: open the TestFlight invitation on the device and install
          or update Cedar. It needs iOS 17 or newer and pairs with your cedar-chat the same way: scan
          the QR code under Settings → Phone. See iOS/README.md.

          ## Cedar $VERSION for Linux

          \`Cedar-$VERSION-linux-x64.tar.gz\` (x86_64) and \`Cedar-$VERSION-linux-arm64.tar.gz\`
          (aarch64, e.g. a DGX Spark) hold the \`cedar\` and \`cedar-chat\` servers for glibc 2.35
          and newer (Ubuntu 22.04, Debian 12). Unpack, install them to \`/usr/local/bin\` and run them
          under systemd as DEPLOYMENT.md describes, in place of building them yourself:

              tar -xzf Cedar-$VERSION-linux-x64.tar.gz
              sudo install -m 0755 Cedar-$VERSION-linux-x64/cedar Cedar-$VERSION-linux-x64/cedar-chat /usr/local/bin/

          Images: \`$REPO/cedar-sandbox:$VERSION\`, \`$REPO/cedar-browser:$VERSION\` (linux/amd64, linux/arm64).
          EOF
          gh release create "v$VERSION" \
            --target "$SHA" \
            --title "Cedar $VERSION" \
            --notes "$(cat notes.md)" \
            --generate-notes \
            dist/*.dmg dist/*.msi dist/*.apk dist/*.tar.gz dist/checksums.txt
