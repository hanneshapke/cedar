<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Install Cedar</title>
<link rel="canonical" href="install.html">
<link rel="icon" href="docs/assets/cedar-mark.svg" type="image/svg+xml">
<script>
// The model guide is part of the install guide now ("Your model" in install.html). Links to this
// page keep working: its answers are carried over as that page's.
(() => {
  const old = new URLSearchParams(location.search);
  const q = new URLSearchParams();
  if (old.get('lang')) q.set('lang', old.get('lang'));
  const where = old.get('where'), hw = old.get('hw'), mem = old.get('mem');
  if (where === 'factory') q.set('model', 'hosted');
  else if (where === 'here' || where === 'box') {
    q.set('model', 'own');
    if (where === 'box') q.set('where', 'box');
  }
  const machine = {
    mac: { os: 'mac', arch: 'arm64', mem: { 24: '16', 48: '48', 96: '96', 128: '128' } },
    gpu: { arch: 'x64', mem: { 12: '12', 16: '12', 24: '24' } },
    ryzen: { os: 'linux', arch: 'x64', mem: { 64: '24', 128: '80' } },
    spark: { os: 'linux', arch: 'arm64', mem: { 128: 'spark', 256: 'spark' } },
    jetson: { os: 'linux', arch: 'arm64', mem: {}, fixed: 'jetson' },
  }[where === 'factory' ? '' : hw];
  if (machine) {
    if (machine.os) q.set('os', machine.os);
    q.set('arch', machine.arch);
    const m = machine.fixed || machine.mem[mem];
    if (m) q.set('mem', m);
  }
  const qs = q.toString();
  location.replace('install.html' + (qs ? '?' + qs : '') + '#model-title');
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=install.html#model-title"></noscript>
</head>
<body>
<p><a href="install.html#model-title">Install Cedar: your model</a></p>
</body>
</html>
