<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 800" width="1230" height="800" role="img" aria-label="cedar-contrib on Google Cloud: a submission passes the load balancer and contrib-api's synchronous checks into quarantine; a scheduled screener job scores it and holds doubtful bundles for review; a monthly release job re-screens, caps, clusters and publishes signed releases that are mirrored to Hugging Face and GitHub." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#24292f">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#24292f"/>
    </marker>
  </defs>
  <rect width="1230" height="800" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="600">cedar-contrib on Google Cloud: submit, screen, release</text>

  <!-- project boundary -->
  <rect x="215" y="40" width="815" height="720" fill="none" stroke="#57606a" stroke-width="1.2" stroke-dasharray="7 5" rx="6"/>
  <text x="228" y="60" font-size="12" fill="#57606a">Google Cloud project (Terraform in the cedar-contrib repo; request logs and data-access audit logs off)</text>

  <!-- lane labels -->
  <text x="240" y="92" font-size="12" font-weight="600" fill="#0969da">1 · submit: synchronous, milliseconds, fail closed</text>
  <text x="240" y="300" font-size="12" font-weight="600" fill="#0969da">2 · screen: a scheduled job every 15 min, probabilistic</text>
  <text x="240" y="556" font-size="12" font-weight="600" fill="#0969da">3 · release: monthly, acts on sets, where poisoning is stopped</text>

  <!-- outside left: cedar-chat -->
  <rect x="10" y="110" width="150" height="70" fill="#fff" stroke="#24292f" stroke-dasharray="4 3" rx="4"/>
  <text x="85" y="138" text-anchor="middle" font-weight="600">cedar-chat</text>
  <text x="85" y="156" text-anchor="middle" font-size="11">the person's own server</text>
  <text x="85" y="170" text-anchor="middle" font-size="11">(the phone never calls here)</text>

  <!-- lane 1 -->
  <rect x="240" y="105" width="160" height="80" fill="#f6f8fa" stroke="#24292f" rx="4"/>
  <text x="320" y="126" text-anchor="middle" font-weight="600">HTTPS load balancer</text>
  <text x="320" y="144" text-anchor="middle" font-size="11">Cloud Armor: IP rate limit, WAF</text>
  <text x="320" y="160" text-anchor="middle" font-size="11">8 MiB body cap</text>
  <text x="320" y="176" text-anchor="middle" font-size="11">backend logging off</text>

  <rect x="440" y="100" width="200" height="90" fill="#f6f8fa" stroke="#0969da" stroke-width="2" rx="4"/>
  <text x="540" y="121" text-anchor="middle" font-weight="600">Cloud Run · contrib-api</text>
  <text x="540" y="139" text-anchor="middle" font-size="11">shape · model allowlist · consistency</text>
  <text x="540" y="155" text-anchor="middle" font-size="11">secret scan · exact dedup · quotas</text>
  <text x="540" y="171" text-anchor="middle" font-size="11">receipt + HMAC withdraw token</text>

  <rect x="830" y="100" width="160" height="90" fill="#f6f8fa" stroke="#24292f" rx="4"/>
  <text x="910" y="121" text-anchor="middle" font-weight="600">GCS bucket</text>
  <text x="910" y="138" text-anchor="middle" font-size="11">contrib-quarantine</text>
  <text x="910" y="154" text-anchor="middle" font-size="11">private · status in metadata</text>
  <text x="910" y="170" text-anchor="middle" font-size="11">withdrawal = real delete</text>

  <!-- lane 1 arrows -->
  <line x1="160" y1="145" x2="238" y2="145" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="199" y="134" text-anchor="middle" font-size="10">POST/DELETE</text>
  <text x="199" y="160" text-anchor="middle" font-size="10">receipt</text>
  <line x1="400" y1="145" x2="438" y2="145" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="640" y1="145" x2="828" y2="145" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="734" y="135" text-anchor="middle" font-size="10">writes object, status = quarantined</text>
  <text x="734" y="160" text-anchor="middle" font-size="10">(nothing is written if any check fails)</text>
  <!-- api -> Firestore, around the top right -->
  <polyline points="560,100 560,78 1000,78 1000,365 992,365" fill="none" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="780" y="74" text-anchor="middle" font-size="10">receipt · pseudonym counters</text>

  <!-- lane 2 -->
  <rect x="240" y="320" width="160" height="60" fill="#f6f8fa" stroke="#24292f" rx="4"/>
  <text x="320" y="345" text-anchor="middle" font-weight="600">Cloud Scheduler</text>
  <text x="320" y="364" text-anchor="middle" font-size="11">every 15 min</text>

  <rect x="440" y="310" width="200" height="110" fill="#f6f8fa" stroke="#0969da" stroke-width="2" rx="4"/>
  <text x="540" y="331" text-anchor="middle" font-weight="600">Cloud Run Job · contrib-screener</text>
  <text x="540" y="349" text-anchor="middle" font-size="11">near-dup · obfuscation · injection</text>
  <text x="540" y="365" text-anchor="middle" font-size="11">harm · label consistency · PII</text>
  <text x="540" y="381" text-anchor="middle" font-size="11">synthetic flood · language</text>
  <text x="540" y="403" text-anchor="middle" font-size="11" font-style="italic">verdict: accepted · held · rejected</text>

  <rect x="830" y="320" width="160" height="90" fill="#f6f8fa" stroke="#24292f" rx="4"/>
  <text x="910" y="341" text-anchor="middle" font-weight="600">Firestore</text>
  <text x="910" y="358" text-anchor="middle" font-size="11">receipts · pseudonyms</text>
  <text x="910" y="374" text-anchor="middle" font-size="11">verdicts · scores</text>
  <text x="910" y="390" text-anchor="middle" font-size="11">review queue</text>

  <rect x="440" y="450" width="140" height="55" fill="#f6f8fa" stroke="#24292f" rx="4"/>
  <text x="510" y="471" text-anchor="middle" font-weight="600">judge model</text>
  <text x="510" y="488" text-anchor="middle" font-size="11">Vertex AI, or vLLM on</text>
  <text x="510" y="500" text-anchor="middle" font-size="11">Cloud Run GPU, scale to 0</text>

  <rect x="620" y="450" width="170" height="55" fill="#f6f8fa" stroke="#24292f" rx="4"/>
  <text x="705" y="471" text-anchor="middle" font-weight="600">review page</text>
  <text x="705" y="488" text-anchor="middle" font-size="11">Cloud Run + IAP, org accounts</text>
  <text x="705" y="500" text-anchor="middle" font-size="11">accept · redact · reject</text>

  <!-- lane 2 arrows -->
  <line x1="400" y1="350" x2="438" y2="350" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="419" y="340" text-anchor="middle" font-size="10">starts</text>
  <polyline points="640,335 760,335 760,180 828,180" fill="none" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="772" y="260" font-size="10">lists status = quarantined,</text>
  <text x="772" y="273" font-size="10">sets verdict status</text>
  <line x1="640" y1="365" x2="828" y2="365" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="734" y="356" text-anchor="middle" font-size="10">verdicts, scores, held → queue</text>
  <line x1="510" y1="420" x2="510" y2="448" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="502" y="438" font-size="10" text-anchor="end">scores it</text>
  <polyline points="610,420 610,477 618,477" fill="none" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="617" y="438" font-size="10">held</text>
  <polyline points="790,477 820,477 820,400 828,400" fill="none" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="826" y="442" font-size="10">decisions</text>

  <!-- lane 3 -->
  <rect x="240" y="580" width="160" height="60" fill="#f6f8fa" stroke="#24292f" rx="4"/>
  <text x="320" y="605" text-anchor="middle" font-weight="600">Cloud Scheduler</text>
  <text x="320" y="624" text-anchor="middle" font-size="11">monthly, or by hand</text>

  <rect x="440" y="570" width="200" height="110" fill="#f6f8fa" stroke="#0969da" stroke-width="2" rx="4"/>
  <text x="540" y="591" text-anchor="middle" font-weight="600">Cloud Run Job · contrib-release</text>
  <text x="540" y="609" text-anchor="middle" font-size="11">re-screen with current checks</text>
  <text x="540" y="625" text-anchor="middle" font-size="11">aging ≥ 14 d · per-contributor caps</text>
  <text x="540" y="641" text-anchor="middle" font-size="11">cluster analysis · label weights</text>
  <text x="540" y="663" text-anchor="middle" font-size="11" font-style="italic">signed manifest (KMS)</text>

  <rect x="440" y="708" width="200" height="42" fill="#f6f8fa" stroke="#24292f" rx="4"/>
  <text x="540" y="726" text-anchor="middle" font-weight="600">cedar-bench ablation</text>
  <text x="540" y="742" text-anchor="middle" font-size="11">Cloud Run Job, GPU, optional</text>

  <rect x="680" y="570" width="150" height="60" fill="#f6f8fa" stroke="#24292f" rx="4"/>
  <text x="755" y="591" text-anchor="middle" font-weight="600">GCS bucket</text>
  <text x="755" y="607" text-anchor="middle" font-size="11">contrib-audit: every decision</text>
  <text x="755" y="622" text-anchor="middle" font-size="11">append-only, bucket lock</text>

  <rect x="830" y="610" width="160" height="70" fill="#f6f8fa" stroke="#24292f" rx="4"/>
  <text x="910" y="631" text-anchor="middle" font-weight="600">GCS bucket</text>
  <text x="910" y="648" text-anchor="middle" font-size="11">contrib-releases</text>
  <text x="910" y="664" text-anchor="middle" font-size="11">public · versioned</text>

  <!-- lane 3 arrows -->
  <line x1="400" y1="610" x2="438" y2="610" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="419" y="600" text-anchor="middle" font-size="10">starts</text>
  <polyline points="620,570 620,540 920,540 920,412" fill="none" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="770" y="534" text-anchor="middle" font-size="10">reads accepted, aged ≥ 14 d; marks released</text>
  <line x1="640" y1="597" x2="678" y2="597" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="640" y1="655" x2="828" y2="655" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="734" y="670" text-anchor="middle" font-size="10">tarballs + signed manifest</text>
  <line x1="540" y1="680" x2="540" y2="706" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="548" y="698" font-size="10">candidate batch ± flagged clusters</text>

  <!-- outside right: mirrors -->
  <rect x="1052" y="595" width="172" height="40" fill="#fff" stroke="#24292f" stroke-dasharray="4 3" rx="4"/>
  <text x="1138" y="613" text-anchor="middle" font-weight="600">Hugging Face dataset</text>
  <text x="1138" y="628" text-anchor="middle" font-size="11">history squashed per release</text>
  <rect x="1052" y="655" width="172" height="40" fill="#fff" stroke="#24292f" stroke-dasharray="4 3" rx="4"/>
  <text x="1138" y="673" text-anchor="middle" font-weight="600">GitHub release</text>
  <text x="1138" y="688" text-anchor="middle" font-size="11">tarballs + pinned hashes</text>
  <polyline points="990,645 1030,645 1030,615 1050,615" fill="none" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>
  <polyline points="1030,645 1030,675 1050,675" fill="none" stroke="#24292f" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- footer -->
  <text x="20" y="785" font-size="11" fill="#57606a">Blue outline: the three admission gates. Dashed boxes: outside the project. A withdrawal is a DELETE at contrib-api: the quarantine object is deleted and its hash joins the exclusion list every release carries.</text>
</svg>
