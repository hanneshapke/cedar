# What /weather/geocode finds and /weather/forecast answers for. A forecast is seeded per place
# and anchor day around `base` (°C); `days` overrides single days, keyed by date token.
# Weather codes are WMO: 0 clear, 1-3 cloud, 61/63/65 rain, 71/73 snow, 95 thunderstorm.
- name: Lisbon
  country: Portugal
  admin1: Lisbon
  latitude: 38.72
  longitude: -9.14
  timezone: Europe/Lisbon
  base: {max: 21, min: 14}
  days:
    "{{sat}}": {code: 63, max: 17.5, min: 13.1, precip: 9.4, precip_prob: 90, wind: 28}
    "{{sun}}": {code: 1, max: 20.2, min: 13.8, precip: 0.0, precip_prob: 10, wind: 12}
- name: Boulder
  aliases: ["boulder co", "boulder, colorado"]
  country: United States
  admin1: Colorado
  latitude: 40.01
  longitude: -105.27
  timezone: America/Denver
  base: {max: 12, min: 0}
  days:
    "{{today+1}}": {code: 71, max: 6.0, min: -4.0, precip: 2.1, precip_prob: 70, wind: 22}
- name: Port Alder
  country: Canada
  admin1: British Columbia
  latitude: 49.31
  longitude: -124.8
  timezone: America/Vancouver
  base: {max: 11, min: 5}
