[package]
name = "cedar-chat"
version.workspace = true
edition = "2021"
description = "A Claude.ai-style web chat for talking to a cedar agent server"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
# Settings -> Phone: the QR code the phone apps scan and the Tailscale checks, shared with the desktop app.
cedar-pairing = { path = "../pairing" }
# Contributing conversations: the bundle, its checks and the redaction scan, shared with the ingest.
cedar-contrib-schema = { path = "../contrib-schema" }
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
futures-util = "0.3"
# Email over SMTP (Settings -> Notifications), with rustls like reqwest.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
# http2: APNs (iPhone push) only speaks HTTP/2.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2"] }
# Web Push: VAPID signatures and payload encryption; the request itself goes through reqwest.
web-push = { version = "0.10", default-features = false }
# web-push encrypts with OpenSSL (its `ece` dependency has no other backend). Built from source and
# linked statically, so cedar-chat needs no OpenSSL library at run time: macOS has none of its own,
# and the signed Mac app's hardened runtime won't load Homebrew's (another team's signature).
# Needs Perl and make for the build (on Windows, Strawberry Perl, not Git's). It also signs (RS256)
# the Firebase service account's token request for Android push.
openssl = { version = "0.10", features = ["vendored"] }
# Generates the VAPID key pair (web-push only reads one) and signs the APNs provider token.
jwt-simple = { version = "0.11", default-features = false }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "net", "time", "io-util", "io-std", "process"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
