[package]
name = "cedar-chat"
version.workspace = true
edition = "2021"
description = "A Claude.ai-style web chat for talking to a cedar agent server"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
futures-util = "0.3"
# Email over SMTP (Settings -> Notifications), with rustls like reqwest.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Web Push: VAPID signatures and payload encryption; the request itself goes through reqwest.
web-push = { version = "0.10", default-features = false }
# Generates the VAPID key pair (web-push only reads one).
jwt-simple = { version = "0.11", default-features = false }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
