<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cedar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23c96442' d='M12 2l1.6 6.1L19.1 5l-3.1 5.5L22 12l-6 1.5 3.1 5.5-5.5-3.1L12 22l-1.6-6.1L4.9 19l3.1-5.5L2 12l6-1.5L4.9 5l5.5 3.1z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Conversations">
      <div class="sidebar-top">
        <a class="brand" href="#/">
          <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l1.6 6.1L19.1 5l-3.1 5.5L22 12l-6 1.5 3.1 5.5-5.5-3.1L12 22l-1.6-6.1L4.9 19l3.1-5.5L2 12l6-1.5L4.9 5l5.5 3.1z"/></svg>
          <span>Cedar</span>
        </a>
        <button class="icon-btn only-narrow" id="close-sidebar" type="button" aria-label="Close sidebar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <button class="new-chat" id="new-chat" type="button">
        <span class="plus" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
        New chat
      </button>
      <div class="section-label">Recents</div>
      <nav class="conv-list" id="conv-list"></nav>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main class="main empty" id="main">
      <header class="topbar">
        <button class="icon-btn only-narrow" id="open-sidebar" type="button" aria-label="Open sidebar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="title-wrap">
          <button class="title" id="title" type="button" title="Rename"></button>
          <input class="title-input" id="title-input" maxlength="200" hidden aria-label="Conversation title">
        </div>
        <button class="icon-btn" id="delete-chat" type="button" aria-label="Delete conversation" title="Delete conversation" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
        </button>
      </header>

      <section class="scroll" id="scroll">
        <div class="welcome" id="welcome">
          <svg class="spark big" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l1.6 6.1L19.1 5l-3.1 5.5L22 12l-6 1.5 3.1 5.5-5.5-3.1L12 22l-1.6-6.1L4.9 19l3.1-5.5L2 12l6-1.5L4.9 5l5.5 3.1z"/></svg>
          <h2 id="greeting">How can I help you today?</h2>
        </div>
        <div class="thread" id="thread"></div>
      </section>

      <footer class="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="How can I help you today?" aria-label="Message"></textarea>
          <div class="composer-row">
            <select id="model" aria-label="Model" hidden></select>
            <span class="hint" id="hint"></span>
            <button class="send" id="send" type="submit" aria-label="Send message" disabled>
              <svg class="i-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
              <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
            </button>
          </div>
        </form>
        <p class="disclaimer">Cedar runs tools in an isolated sandbox. Check important results.</p>
      </footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="token-dialog">
    <form method="dialog" id="token-form">
      <h3>Access token</h3>
      <p id="token-message">This server requires an access token.</p>
      <input id="token-input" type="password" autocomplete="current-password" required aria-label="Access token">
      <div class="dialog-actions"><button type="submit" class="primary">Continue</button></div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
