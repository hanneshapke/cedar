[package]
name = "cedar-pairing"
version.workspace = true
edition = "2021"
description = "Pairing the Cedar iOS app with a chat server: the QR code it scans and the Tailscale checks"
license = "Apache-2.0"

# Shared by cedar-chat (Settings -> iPhone) and the desktop app (its setup page), so the two show
# the same code and say the same about Tailscale. No I/O here: each runs the tailscale CLI its own way.
[dependencies]
anyhow = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
