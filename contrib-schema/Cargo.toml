[package]
name = "cedar-contrib-schema"
version.workspace = true
edition = "2021"
description = "The bundle a cedar conversation is contributed as: its types, consistency checks and redaction scan, shared by cedar-chat (which builds and sends bundles) and cedar-contrib (which receives them)"
license = "Apache-2.0"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
